# Gitleaks configuration: default ruleset plus an allowlist for template files.
# Template files hold empty values / placeholders only. Real secrets live in
# .env and secrets.h, which are git-ignored and are still scanned if committed.

[extend]
useDefault = true

[allowlist]
description = "Credential templates contain placeholders only"
paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)secrets\.example\.h$''',
]
