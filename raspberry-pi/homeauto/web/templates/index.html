<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Automation Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Home Automation Hub</h1>

    <section id="auth">
      <label for="token">API token</label>
      <input id="token" type="password" autocomplete="off" placeholder="HOMEAUTO_API_TOKEN">
      <button id="save-token">Connect</button>
    </section>

    <section class="grid">
      <article>
        <h2>Light</h2>
        <p class="value" id="led">--</p>
        <div class="row">
          <button data-led="on">ON</button>
          <button data-led="off">OFF</button>
        </div>
      </article>
      <article>
        <h2>Mode</h2>
        <p class="value" id="mode">--</p>
        <div class="row">
          <button data-mode="auto">Auto (PIR)</button>
          <button data-mode="manual">Manual</button>
        </div>
      </article>
      <article>
        <h2>Motion</h2>
        <p class="value" id="motion">--</p>
      </article>
      <article>
        <h2>Climate</h2>
        <p class="value" id="climate">--</p>
      </article>
    </section>

    <p id="status" role="status"></p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
