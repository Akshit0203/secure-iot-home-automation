[project]
name = "homeauto"
version = "1.0.0"
description = "Raspberry Pi edge controller for the Secure IoT Home Automation & Monitoring Platform"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "S311", "S603", "S607", "S310", "S113"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
